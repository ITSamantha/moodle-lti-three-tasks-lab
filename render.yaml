services:
  - type: web
    name: moodle-lti-three-tasks-lab
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: APP_LABEL
        value: Тренажер: три задания
      - key: DATA_DIR
        value: ./data
      - key: PUBLIC_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: MOODLE_ISSUER
        sync: false
      - key: MOODLE_CLIENT_ID
        sync: false
      - key: MOODLE_DEPLOYMENT_ID
        sync: false
      - key: MOODLE_AUTH_URL
        sync: false
      - key: MOODLE_TOKEN_URL
        sync: false
      - key: MOODLE_JWKS_URL
        sync: false
